name: Deploy to GitHub

# Controls when the action will run. 
on:
  push:
    tags:
    - "v[0-9]+.[0-9]+"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up GnuPG
      env:
        GPG_EXECUTABLE: gpg
        GPG_SECRET_KEYS: ${{ secrets.GPG_SECRET_KEYS }}
        GPG_OWNERTRUST: ${{ secrets.GPG_OWNERTRUST }}
      run: |
        mkdir -m 700 ~/.gnupg/
        echo 'use-agent' > ~/.gnupg/gpg.conf
        echo 'pinentry-mode loopback' >> ~/.gnupg/gpg.conf
        echo 'allow-loopback-pinentry' > ~/.gnupg/gpg-agent.conf
        echo $GPG_SECRET_KEYS | base64 --decode | $GPG_EXECUTABLE  --yes --batch --import
        echo $GPG_OWNERTRUST | base64 --decode | $GPG_EXECUTABLE  --yes --batch --import-ownertrust

    - name: Checkout Source
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Cache maven repository
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven


    - name: Shade with Maven
      run: |
        mvn -B package -P shade
        echo "Exporting Variables"
        export PROJECT_NAME=$(mvn -Dexec.executable='echo' -Dexec.args='${project.build.finalName}' exec:exec -q)
        echo "JAR_FILE=${PROJECT_NAME}-jar-with-dependencies.jar" >> $GITHUB_ENV
        export version=$(mvn -Dexec.executable='echo' -Dexec.args='${project.version}' --non-recursive exec:exec -q)
        echo "DOCKER_TAG_FULL=${version}"          >> $GITHUB_ENV


    - name: Upload Shaded Jar
      uses: actions/upload-artifact@v7
      with:
        path: target/${{ env.JAR_FILE }}
        archive: false


    - name: Create Release
      if: github.ref_type == 'tag'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.ref_name }} -F CHANGELOG.md -d
        gh release upload ${{ github.ref_name }} target/${{ env.JAR_FILE }}
